# Magic-ORM 数据库配置文件示例
# 请根据实际情况修改以下配置

database:
  # 数据库地址（MySQL/PostgreSQL 为 IP 或域名，SQLite 可忽略）
  host: "127.0.0.1"
  
  # 数据库端口
  port: "3306"
  
  # 数据库用户名
  user: "root"
  
  # 数据库密码
  pass: "your_password"
  
  # 数据库名称
  name: "your_database"
  
  # 数据库类型（支持：mysql, postgres, sqlite）
  type: "mysql"

# 其他配置可以继续添加...
